services:
  api:
    build:
      context: .
      dockerfile: apps/apigee/Dockerfile.runtime
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      SQLITE_DB_PATH: /data/artchew.sqlite
    ports:
      - "3000:3000"
    volumes:
      - sqlite-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/artchew/Dockerfile.runtime
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 4200
      API_INTERNAL_URL: http://api:3000
    ports:
      - "4200:4200"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4200/api/students').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  sqlite-data:
